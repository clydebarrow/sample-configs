substitutions:
  name: esp32-2424s012
  friendly_name: Guition ESP32-2424S012

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32c3
  #cpu_frequency: 160MHz
  framework:
    type: esp-idf

logger:
  level: debug

debug:

spi:
  mosi_pin: GPIO7
  clk_pin: GPIO6

display:
  - platform: mipi_spi
    enable_pin: 3 # backlight
    id: display_id
    model: esp32-2424s012
    rotation: 90

i2c:
  scl: 5
  sda: 4
  frequency: 400kHz


