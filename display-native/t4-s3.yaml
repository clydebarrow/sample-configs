esphome:
  name: t4-amoled

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: DEBUG

spi:
  id: quad_spi
  type: quad
  clk_pin: 15
  data_pins: [14, 10, 16, 12]

i2c:
  sda: 6
  scl: 7

touchscreen:
  - platform: cst226
    id: my_touchscreen
    interrupt_pin: 8
    reset_pin: 17
    on_touch:
      - lambda: |-
          auto rotation = (id(disp_id).get_rotation() + 90) % 360;
          id(disp_id).set_rotation((display::DisplayRotation)rotation);
          id(disp_id).update();

display:
  - platform: mipi_spi
    id: disp_id
    model: T4-S3

psram:
  mode: octal
  speed: 80MHz

