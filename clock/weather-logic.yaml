# Live data behind the status bar declared in weather-widget.yaml: today's
# date, the current Home Assistant weather condition (mapped to an MDI icon
# exactly like ../dexfield/smalltv-package.yaml, just driven into an LVGL
# image instead of drawn straight to the display), and the outside
# temperature sensor. Kept separate from the widget file since, like
# flip-digit-logic.yaml, this part has no nesting requirement and is
# included the normal way via `packages:`.
#
# Parameterized by `time_id`, the id of whichever already-declared `time:`
# platform gives real wall-clock time on the target - `clock_time` (the
# host-platform clock in flip-clock.yaml) for host.yaml, `sntp_time` for
# cyd.yaml. An `interval:` reads it periodically rather than adding another
# `on_time` trigger to that entity, since a second `time:` block with the
# same id would collide with the one already declared for the flip clock.
#
# Icons are `type: BINARY` + `transparency: chroma_key` (a plain glyph on a
# transparent background) rather than smalltv-package.yaml's `grayscale` +
# alpha_channel: that's the combination LVGL's `image_recolor` style
# property expects, so the one icon set can be tinted to suit either a
# light (host.yaml) or dark (cyd.yaml) screen - see weather-widget.yaml's
# `icon_recolor` parameter.
text_sensor:
  - platform: homeassistant
    id: weather_condition
    entity_id: weather.forecast_dexfield_park
    on_value:
      - lvgl.image.update:
          id: weather_icon
          src:
            mapping: weather_icons
            value: !lambda return x;
      - lvgl.label.update:
          id: weather_condition_label
          text: !lambda |-
            std::string c = x;
            if (!c.empty())
              c[0] = toupper(c[0]);
            return c;

sensor:
  - platform: homeassistant
    id: outside_temp
    entity_id: sensor.st_00141258_temperature
    on_value:
      - lvgl.label.update:
          id: temperature_label
          text:
            format: "%.1f°C"
            args: [x]

interval:
  - interval: 30s
    then:
      - lvgl.label.update:
          id: date_label
          text:
            time_format: "%a, %b %d"

image:
  - platform: file
    defaults:
      type: grayscale
      transparency: alpha_channel
      resize: 60x60
    files:
      - file: "mdi:weather-sunny"
        id: icon_sunny
      - file: "mdi:weather-cloudy"
        id: icon_cloudy
      - file: "mdi:weather-partly-cloudy"
        id: icon_partly_cloudy
      - file: "mdi:weather-pouring"
        id: icon_pouring
      - file: "mdi:weather-rainy"
        id: icon_rainy
      - file: "mdi:weather-snowy"
        id: icon_snowy
      - file: "mdi:weather-lightning"
        id: icon_thunder
      - file: "mdi:weather-night"
        id: icon_weather_night
      - file: "mdi:alert-outline"
        id: icon_unknown

mapping:
  id: weather_icons
  from: string
  to: image
  default_value: icon_unknown
  entries:
    sunny: icon_sunny
    clear-night: icon_weather_night
    cloudy: icon_cloudy
    fog: icon_cloudy
    partly_cloudy: icon_partly_cloudy
    partlycloudy: icon_partly_cloudy
    rainy: icon_rainy
    pouring: icon_pouring
    snowy: icon_snowy
    lightning: icon_thunder
    lightning-rainy: icon_thunder
