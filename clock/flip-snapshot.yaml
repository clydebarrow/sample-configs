substitutions:
  name: host-lvgl-snap
  friendly_name: Host lvgl snapshot debug
  # yields the same 120pt digit font this file used to hardcode directly
  base_height: 450

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - delay: 500ms
      - script.execute:
          id: flip_1_digit
          m1: 5
      - delay: 800ms
      - script.execute:
          id: flip_2_digits
          m0: 3
          m1: 7
      - delay: 800ms
      - script.execute:
          id: flip_3_digits
          h1: 9
          m0: 0
          m1: 0
      - delay: 800ms
      - script.execute:
          id: flip_4_digits
          h0: 2
          h1: 3
          m0: 5
          m1: 9

host:
  mac_address: "62:23:45:AF:B3:DE"

network:

logger:

display:
  - platform: snapshot
    id: snap_display
    dimensions:
      width: 1280
      height: 800

interval:
  - interval: 40ms
    then:
      - snapshot.take: snap_display

packages:
  clock_base: !include
    file: clock-base.yaml
    vars:
      base_height: ${base_height}
      time_id: clock_time

time:
  - platform: host
    id: clock_time

lvgl:
  widgets:
    - !include
      file: clock-widget.yaml
      vars:
        align: center
