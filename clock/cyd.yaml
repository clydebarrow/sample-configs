# Sunton ESP32 2.8" 240x320 with touch
# Flip clock 

substitutions:
  name: flip-clock
  friendly_name: Flip Clock

esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"
      sram1_as_iram: true

packages:
  standard: !include standard.yaml
  clock: !include
    file: flip-clock.yaml
    vars:
      font: digit_font
      align: top_mid
      gap: 4px
      card_pad: 10px
  weather_logic: !include
    file: weather-logic.yaml
    vars:
      time_id: sntp_time
  weather_widget: !include
    file: weather-widget.yaml
    vars:
      font: font_medium
      font_temperature: font_temperature
      font_small: font_small

font:
  - file: "gfonts://Roboto"
    id: digit_font
    bpp: 4
    size: 64
  - file: "gfonts://Roboto"
    id: font_small
    bpp: 4
    size: 16
    # Covers weekday/month abbreviations, the date, and a signed
    # temperature reading
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz, -0123456789°."
  - file: "gfonts://Roboto"
    id: font_medium
    bpp: 4
    size: 28
    # Covers weekday/month abbreviations, the date, and a signed
    # temperature reading
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz, -0123456789°."
  - file: "gfonts://Roboto"
    id: font_temperature
    bpp: 4
    size: 40
    glyphs: "C -0123456789°."

api:
  encryption:
    key: !secret encryption_key

ota:
  platform: esphome
  encryption:

time:
  - platform: sntp
    id: sntp_time
    on_time_sync:
      then:
        - script.execute: clock_tick

logger:
  logs:
    xpt2046: info

sensor:
  - platform: adc
    pin: GPIO34
    id: ldr_voltage
    name: LDR voltage
    attenuation: auto
    update_interval: 2s
    accuracy_decimals: 2

  - platform: copy
    source_id: ldr_voltage
    id: ambient_light
    name: Ambient Light
    unit_of_measurement: "%"
    filters:
      - multiply: -0.3
      - offset: 1.0
      - clamp:
          max_value: 1.0
          min_value: 0.1
    on_value:
      then:
        - light.turn_on:
            id: backlight_id
            brightness: !lambda return x;
  # outside_temp is declared in weather-logic.yaml (shared with host.yaml)

output:
  - platform: ledc
    id: gpio_5_backlight_pwm
    pin: 21
    frequency: 44100
    inverted: false

light:
  - platform: monochromatic
    output: gpio_5_backlight_pwm
    id: backlight_id
    restore_mode: ALWAYS_ON
    gamma_correct: 2.8

spi:
  - id: disp_spi
    clk_pin: 14
    mosi_pin: 13
  - id: touch_spi
    clk_pin: 25
    mosi_pin: 32
    miso_pin: 39

touchscreen:
  platform: xpt2046
  spi_id: touch_spi
  id: my_touchscreen
  cs_pin: 33
  interrupt_pin: 36
  update_interval: 50ms
  threshold: 400
  transform:
    swap_xy: false
    mirror_y: false
    mirror_x: true
  calibration:
    x_min: 367
    x_max: 3355
    y_min: 296
    y_max: 3642

display:
  - platform: mipi_spi
    spi_id: disp_spi
    buffer_size: 12%
    #model: esp32-2432S028 # uses ili9341
    #model: esp32-2432S028-9342 # Uses ILI9342
    model: esp32-2432S028-7789 # Uses ST7789V controller


lvgl:
  rotation: 90
  theme:
    dark_mode: true
  bg_color: black
  pad_top: 8px
  clickable: true
  on_click:
    - logger.log:
        format: "Click detected"
  on_long_press:
    - logger.log:
        format: "Long press detected, turning off all lights"
        level: INFO
    - homeassistant.action:
        action: script.lighting_all_off
