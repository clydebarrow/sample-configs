
substitutions:
  name: host-lvgl
  friendly_name: Host lvgl test

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    #lib_deps:
    #  - symlink:///Users/clyde/dev/opensourceprojects/piolibs/lvgl
    build_flags:
    - -g3
  on_boot:
    script.execute: clock_tick

host:
  mac_address: "62:23:45:AF:B3:DD"

network:

logger:

touchscreen:
  - platform: sdl
    id: sdl_touchscreen

display:
  - platform: sdl
    id: display_id
    dimensions:
      width: 320
      height: 240

font:
  - file: "gfonts://Roboto"
    id: digit_font
    bpp: 4
    size: 64
  - file: "gfonts://Roboto"
    id: font_medium
    bpp: 4
    size: 28
    # Covers weekday/month abbreviations, the date, and a signed
    # temperature reading
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz, -0123456789°."

# Needed for the `platform: homeassistant` sensors in weather-logic.yaml,
# which pull the weather condition/temperature over the native API
api:
  encryption:
    key: !secret encryption_key

packages:
  clock: !include
    file: flip-clock.yaml
    vars:
      font: digit_font
      gap: 4px
      card_pad: 10px
      # top-aligned, not the flip-clock.yaml default of centered, to leave
      # room below for the weather status bar
      align: top_mid
  weather_logic: !include
    file: weather-logic.yaml
    vars:
      time_id: clock_time
  weather_widget: !include
    file: weather-widget.yaml
    vars:
      font: font_medium
      # host.yaml's screen has no explicit theme/bg_color, so it renders
      # with LVGL's default light background - dark text/icon reads
      # clearly on it
      #text_color: 0x000000
      #icon_recolor: 0x000000

lvgl:
  theme:
    dark_mode: true
  pad_top: 8px

